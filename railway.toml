# Prefer Dockerfile over Railpack/Nixpacks on Railway.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Avoid npx (cache/HOME quirks as USER nextjs). Call Prisma CLI directly.
preDeployCommand = "sh -c \"node node_modules/prisma/build/index.js migrate deploy\""
startCommand = "node server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
