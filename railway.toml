# Prefer Dockerfile over Railpack/Nixpacks on Railway.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migrate needs DIRECT_URL on Session :5432; app DATABASE_URL should be
# Transaction :6543 with pgbouncer=true.
preDeployCommand = "node scripts/migrate-deploy.mjs"
startCommand = "node server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
